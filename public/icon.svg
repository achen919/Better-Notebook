<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 书本 -->
  <g transform="translate(100, 140)">
    <!-- 左页 -->
    <path d="M0,0 L140,0 L140,220 L0,220 Z" fill="#fff" opacity="0.95"/>
    <path d="M0,0 L140,0 L140,10 L10,30 L10,210 L0,220 Z" fill="#e8e8e8"/>
    <!-- 右页 -->
    <path d="M150,0 L290,0 L290,220 L150,220 Z" fill="#fff" opacity="0.9"/>
    <path d="M290,0 L290,220 L300,210 L300,30 L150,10 Z" fill="#ddd"/>
    <!-- 书脊 -->
    <path d="M140,0 L150,0 L150,220 L140,220 Z" fill="#666"/>
    <!-- 文字线条 -->
    <line x1="20" y1="50" x2="120" y2="50" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="110" x2="110" y2="110" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="140" x2="90" y2="140" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="50" x2="270" y2="50" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="80" x2="250" y2="80" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="110" x2="260" y2="110" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 艾宾浩斯遗忘曲线 -->
  <g transform="translate(80, 100)">
    <path d="M0,200 Q80,180 120,140 Q180,60 250,80 Q320,100 350,60"
          fill="none"
          stroke="url(#curveGrad)"
          stroke-width="12"
          stroke-linecap="round"
          opacity="0.9"/>
    <!-- 曲线上的点 -->
    <circle cx="0" cy="200" r="14" fill="#f5576c"/>
    <circle cx="120" cy="140" r="12" fill="#f5576c" opacity="0.8"/>
    <circle cx="250" cy="80" r="12" fill="#f5576c" opacity="0.8"/>
    <circle cx="350" cy="60" r="14" fill="#f5576c"/>
  </g>

  <!-- 大脑图标 -->
  <g transform="translate(380, 60)">
    <ellipse cx="40" cy="45" rx="38" ry="40" fill="#fff" opacity="0.2"/>
    <path d="M40,10 C20,10 5,25 5,45 C5,55 10,65 20,72 C15,78 15,88 22,92 C30,96 40,92 45,85 C50,92 62,96 70,90 C78,84 78,72 72,65 C82,58 88,48 85,38 C82,28 70,20 60,22 C55,15 48,10 40,10"
          fill="#fff" opacity="0.7"/>
    <path d="M40,25 C30,25 25,35 28,42 C22,45 20,55 25,60 C20,65 22,75 30,78 C28,82 32,88 40,88 C48,88 52,82 50,78 C58,75 60,65 55,60 C60,55 58,45 52,42 C55,35 50,25 40,25"
          fill="#f8b4d9" opacity="0.8"/>
  </g>
</svg>
